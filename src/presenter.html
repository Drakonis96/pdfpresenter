<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Vista Presentador</title>
  <link rel="icon" type="image/png" href="../public/logo.png">
  <link rel="stylesheet" href="styles/presenter.css">
</head>
<body>
  <div class="presenter-layout">
    <!-- Top bar -->
    <div class="presenter-topbar">
      <div class="topbar-left">
        <span class="presentation-name" id="presentation-name"></span>
      </div>
      <div class="topbar-center">
        <button class="topbar-btn" id="btn-prev" title="Anterior">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span class="slide-counter" id="slide-counter">1 / 1</span>
        <button class="topbar-btn" id="btn-next" title="Siguiente">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="9 18 15 12 9 6"/>
          </svg>
        </button>
      </div>
      <div class="topbar-right">
        <span class="timer" id="timer">00:00:00</span>
        <button class="topbar-btn" id="btn-timer-toggle" title="Iniciar/Pausar timer">
          <svg id="timer-play-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <svg id="timer-pause-icon" class="hidden" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
          </svg>
        </button>
        <button class="topbar-btn" id="btn-timer-reset" title="Reiniciar timer">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
        </button>
        <button class="topbar-btn" id="btn-black-screen" title="Pantalla en negro (B)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </button>
        <button class="topbar-btn" id="btn-qr" title="Mostrar código QR">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="2" width="8" height="8" rx="1"/>
            <rect x="14" y="2" width="8" height="8" rx="1"/>
            <rect x="2" y="14" width="8" height="8" rx="1"/>
            <path d="M14 14h4v4h-4zM22 14v8h-8"/>
          </svg>
        </button>
        <button class="topbar-btn" id="btn-cast" title="AirPlay / Chromecast">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M2 16.1A5 5 0 0 1 5.9 20M2 12.05A9 9 0 0 1 9.95 20M2 8V6a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-6"/>
            <line x1="2" y1="20" x2="2.01" y2="20"/>
          </svg>
        </button>
        <span class="system-clock" id="system-clock"></span>
        <button class="topbar-btn btn-end" id="btn-end" title="Finalizar presentación">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
          </svg>
          <span>Finalizar</span>
        </button>
      </div>
    </div>

    <!-- Main content area -->
    <div class="presenter-main">
      <!-- Left: Current slide with tools -->
      <div class="current-slide-area">
        <div class="slide-container" id="current-slide-container">
          <div class="slide-wrapper" id="current-slide-wrapper">
            <canvas id="current-slide-canvas"></canvas>

            <!-- YouTube video overlay -->
            <div class="video-overlay hidden" id="video-overlay">
              <iframe id="video-iframe" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
              <div class="video-controls" id="video-controls">
                <button class="video-play-btn" id="video-play-btn" title="Reproducir/Pausar">
                  <svg id="video-play-icon" width="36" height="36" viewBox="0 0 24 24" fill="white">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                  </svg>
                  <svg id="video-pause-icon" class="hidden" width="36" height="36" viewBox="0 0 24 24" fill="white">
                    <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                  </svg>
                </button>
                <div class="video-progress-container" id="video-progress-container">
                  <span class="video-time" id="video-time-current">0:00</span>
                  <input type="range" class="video-seek-slider" id="video-seek-slider" min="0" max="1000" value="0" step="1">
                  <span class="video-time" id="video-time-duration">0:00</span>
                </div>
              </div>
            </div>

            <!-- Tool overlays -->
            <div class="tool-overlay hidden" id="flashlight-overlay">
              <div class="flashlight-mask" id="flashlight-mask"></div>
            </div>
            <canvas class="tool-overlay hidden" id="draw-overlay"></canvas>
            <div class="tool-overlay hidden" id="pointer-overlay">
              <div class="pointer-dot" id="pointer-dot"></div>
            </div>
            <div class="tool-overlay hidden" id="zoom-overlay">
              <div class="zoom-lens" id="zoom-lens">
                <canvas id="zoom-canvas"></canvas>
              </div>
            </div>
          </div>
        </div>

        <!-- Tools bar -->
        <div class="tools-bar" id="tools-bar">
          <div class="tools-group">
            <button class="tool-btn" id="tb-flashlight" data-tool="flashlight" title="Linterna (⌘L)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 18h6"/>
                <path d="M10 22h4"/>
                <path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0 0 18 8 6 6 0 0 0 6 8c0 1 .23 2.23 1.5 3.5A4.61 4.61 0 0 1 8.91 14"/>
              </svg>
            </button>
            <button class="tool-btn" id="tb-draw" data-tool="draw" title="Dibujo (⌘D)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                <path d="M2 2l7.586 7.586"/>
                <circle cx="11" cy="11" r="2"/>
              </svg>
            </button>
            <button class="tool-btn" id="tb-pointer" data-tool="pointer" title="Puntero (⌘P)">
              <span class="pointer-icon-small"></span>
            </button>
            <button class="tool-btn" id="tb-zoom" data-tool="zoom" title="Lupa (⌘M)">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
            </button>
          </div>
          <div class="tools-separator"></div>
          <div class="tools-group">
            <div class="tools-colors">
              <button class="tool-color" data-color="#6366f1" style="background:#6366f1"></button>
              <button class="tool-color active" data-color="#ef4444" style="background:#ef4444"></button>
              <button class="tool-color" data-color="#22c55e" style="background:#22c55e"></button>
              <button class="tool-color" data-color="#ffffff" style="background:#ffffff; border-color: rgba(255,255,255,0.3)"></button>
            </div>
          </div>
          <div class="tools-separator"></div>
          <div class="tools-group">
            <label class="tool-size-label">Tamaño</label>
            <input type="range" class="tool-slider" id="tool-size-slider" min="2" max="50" value="15">
          </div>
          <div class="tools-separator"></div>
          <div class="tools-group">
            <button class="tool-btn" id="tb-clear" title="Limpiar dibujo">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="3 6 5 6 21 6"/>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- Resizable divider -->
      <div class="resize-divider" id="resize-divider"></div>

      <!-- Right panel: next slide + notes -->
      <div class="right-panel" id="right-panel">
        <div class="next-slide-area" id="next-slide-area">
          <div class="panel-label">Siguiente diapositiva</div>
          <div class="next-slide-container" id="next-slide-container">
            <canvas id="next-slide-canvas"></canvas>
            <div class="no-next-slide hidden" id="no-next-slide">
              <span>Fin de la presentación</span>
            </div>
          </div>
        </div>
        <!-- Horizontal resize divider -->
        <div class="resize-divider-h" id="resize-divider-h"></div>
        <div class="notes-area" id="notes-area">
          <div class="notes-header">
            <div class="panel-label">Notas del presentador</div>
            <div class="notes-font-controls">
              <button class="notes-font-btn" id="btn-font-decrease" title="Reducir tamaño de notas">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
              <span class="notes-font-label" id="notes-font-label">15px</span>
              <button class="notes-font-btn" id="btn-font-increase" title="Aumentar tamaño de notas">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              </button>
            </div>
          </div>
          <div class="notes-content" id="notes-content">
            <p class="notes-empty">Sin notas para esta diapositiva</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Thumbnail carousel -->
    <div class="thumbnail-carousel" id="thumbnail-carousel"></div>
  </div>

  <!-- QR Overlay -->
  <div class="qr-overlay hidden" id="qr-overlay">
    <div class="qr-modal">
      <div id="qr-content"><p style="color:rgba(255,255,255,0.5)">Cargando...</p></div>
      <p class="qr-url-text" id="qr-url-text"></p>
      <button class="qr-close-btn" id="qr-close-btn">Cerrar</button>
    </div>
  </div>

  <script>
    const script = document.createElement('script');
    script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    script.onload = () => {
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      initPresenter();
    };
    document.head.appendChild(script);

    let pdfDoc = null;
    let currentSlide = 1;
    let totalSlides = 0;
    let presentationData = null;
    let activeTool = null;
    let toolSize = 15;
    let drawColor = '#ef4444';
    let isLocalDrawing = false;
    let isDrawing = false;
    let lastDrawX = 0;
    let lastDrawY = 0;
    let videoPlaying = false;
    let currentVideoId = null;
    let videoDuration = 0;
    let videoCurrentTime = 0;
    let videoSeeking = false;
    let videoTimeInterval = null;
    const ZOOM_FACTOR = 2.5;
    let notesFontSize = 15;
    let renderTasks = {}; // Track in-flight PDF.js render tasks per canvas

    // Timer
    let timerRunning = false;
    let timerSeconds = 0;
    let timerInterval = null;
    let blackScreenEnabled = false;

    async function initPresenter() {
      const params = window.api.getQueryParams();
      const pdfId = params.pdfId;
      if (!pdfId) return;

      const stored = await window.api.getPresentations();
      const presentations = Array.isArray(stored) ? stored : (stored.presentations || []);
      presentationData = presentations.find(p => p.id === pdfId);
      if (!presentationData) return;

      document.getElementById('presentation-name').textContent = presentationData.name;

      const base64 = await window.api.getPdfData(pdfId);
      const data = Uint8Array.from(atob(base64), c => c.charCodeAt(0));
      pdfDoc = await pdfjsLib.getDocument({ data }).promise;
      totalSlides = pdfDoc.numPages;

      const startSlide = Math.min(Math.max(parseInt(params.startSlide) || 1, 1), totalSlides);
      renderSlide(startSlide);
      setupTools();
      setupNavigation();
      setupTimer();
      setupKeyboardShortcuts();
      setupMouseTools();
      setupScrollWheel();
      setupVideoPlayButton();
      setupVideoSeekSlider();
      setupResizeDivider();
      setupHorizontalDivider();
      setupNoteFontControls();
      setupQRButton();
      setupCastButton();
      setupBlackScreenButton();
      setupSystemClock();
      renderThumbnailCarousel();

      // Listen for controls from remote (mobile)
      window.api.onPresentationControl(handleRemoteControl);

      // Listen for end presentation
      window.api.onPresentationEnded(() => {
        window.close();
      });

      // Start timer automatically
      startTimer();
    }

    async function renderSlide(num) {
      currentSlide = num;
      document.getElementById('slide-counter').textContent = `${num} / ${totalSlides}`;

      // Render current slide
      await renderSlideToCanvas(num, 'current-slide-canvas', 'current-slide-container');

      // Render next slide preview
      if (num < totalSlides) {
        document.getElementById('next-slide-canvas').classList.remove('hidden');
        document.getElementById('no-next-slide').classList.add('hidden');
        await renderSlideToCanvas(num + 1, 'next-slide-canvas', 'next-slide-container');
      } else {
        document.getElementById('next-slide-canvas').classList.add('hidden');
        document.getElementById('no-next-slide').classList.remove('hidden');
      }

      // Update notes
      updateNotes(num);

      // Update thumbnail carousel active state
      updateCarouselActive(num);

      // Update video overlay
      updateVideoOverlay(num);

      // Clear drawing
      const drawCanvas = document.getElementById('draw-overlay');
      if (drawCanvas.getContext) {
        const slideCanvas = document.getElementById('current-slide-canvas');
        drawCanvas.width = slideCanvas.width;
        drawCanvas.height = slideCanvas.height;
        drawCanvas.getContext('2d').clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      }

      // Send navigation to audience window
      window.api.sendPresenterControl({ type: 'navigate', slide: num });

      // Update server state so mobile remote stays in sync
      window.api.sendStateUpdate({ currentSlide: num });
    }

    async function renderSlideToCanvas(pageNum, canvasId, containerId) {
      // Cancel any in-progress render for this canvas
      if (renderTasks[canvasId]) {
        try { renderTasks[canvasId].cancel(); } catch(e) {}
        renderTasks[canvasId] = null;
      }

      const page = await pdfDoc.getPage(pageNum);
      const canvas = document.getElementById(canvasId);
      const container = document.getElementById(containerId);

      const containerW = container.clientWidth;
      const containerH = container.clientHeight;

      // Skip render if container has no dimensions (window hidden/minimized)
      if (containerW === 0 || containerH === 0) return;

      const defaultViewport = page.getViewport({ scale: 1 });
      const scaleX = containerW / defaultViewport.width;
      const scaleY = containerH / defaultViewport.height;
      const scale = Math.min(scaleX, scaleY);
      const dpr = window.devicePixelRatio || 1;
      const viewport = page.getViewport({ scale: scale * dpr });

      // Buffer at high resolution; set explicit CSS size for correct display
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.style.width = Math.floor(viewport.width / dpr) + 'px';
      canvas.style.height = Math.floor(viewport.height / dpr) + 'px';

      const ctx = canvas.getContext('2d');
      const renderTask = page.render({ canvasContext: ctx, viewport });
      renderTasks[canvasId] = renderTask;

      try {
        await renderTask.promise;
      } catch(e) {
        if (e.name !== 'RenderingCancelledException') throw e;
      } finally {
        if (renderTasks[canvasId] === renderTask) {
          renderTasks[canvasId] = null;
        }
      }
    }

    function updateNotes(slideNum) {
      const notesEl = document.getElementById('notes-content');
      const note = presentationData.notes && presentationData.notes[slideNum];
      if (note) {
        const paragraphs = note.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
        notesEl.innerHTML = paragraphs.map(p => `<p class="notes-text" style="font-size:${notesFontSize}px">${escapeHtml(p).replace(/\n/g, ' ')}</p>`).join('');
      } else {
        notesEl.innerHTML = '<p class="notes-empty">Sin notas para esta diapositiva</p>';
      }
    }

    function updateVideoOverlay(slideNum) {
      const overlay = document.getElementById('video-overlay');
      const iframe = document.getElementById('video-iframe');

      // Clean up previous video tracking
      stopVideoTimeTracking();

      if (presentationData.videos && presentationData.videos[slideNum]) {
        const v = presentationData.videos[slideNum];
        const videoId = extractYouTubeId(v.url);
        if (videoId) {
          currentVideoId = videoId;
          const origin = encodeURIComponent(window.location.origin);
          iframe.src = `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&enablejsapi=1&mute=1&origin=${origin}`;
          // NOTE: mute=1 intentional — audio should only play in audience view
          overlay.style.left = v.x + '%';
          overlay.style.top = v.y + '%';
          overlay.style.width = v.w + '%';
          overlay.style.height = v.h + '%';
          overlay.classList.remove('hidden');
          videoPlaying = false;
          videoDuration = 0;
          videoCurrentTime = 0;
          updateVideoPlayButton();
          resetVideoSlider();
          setupYouTubeListener(iframe);
          // Also send to audience
          window.api.sendPresenterControl({ type: 'video-show', data: { slideNum, videoId, x: v.x, y: v.y, w: v.w, h: v.h } });
          return;
        }
      }
      currentVideoId = null;
      overlay.classList.add('hidden');
      iframe.src = '';
      resetVideoSlider();
    }

    function toggleVideoPlaybackLocal() {
      const iframe = document.getElementById('video-iframe');
      const overlay = document.getElementById('video-overlay');
      if (!currentVideoId || overlay.classList.contains('hidden')) return;

      if (videoPlaying) {
        iframe.contentWindow.postMessage('{"event":"command","func":"pauseVideo","args":""}', '*');
        videoPlaying = false;
      } else {
        iframe.contentWindow.postMessage('{"event":"command","func":"playVideo","args":""}', '*');
        videoPlaying = true;
      }
      updateVideoPlayButton();
    }

    function toggleVideoPlayback() {
      toggleVideoPlaybackLocal();
      // Forward to audience window
      window.api.sendPresenterControl({ type: 'video-toggle' });
      // Update server state so mobile remote stays in sync
      window.api.sendStateUpdate({ videoPlaying });
    }

    function updateVideoPlayButton() {
      document.getElementById('video-play-icon').classList.toggle('hidden', videoPlaying);
      document.getElementById('video-pause-icon').classList.toggle('hidden', !videoPlaying);
    }

    function extractYouTubeId(url) {
      if (!url) return null;
      const match = url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube(?:-nocookie)?\.com\/embed\/)([a-zA-Z0-9_-]{11})/);
      return match ? match[1] : null;
    }

    // ===== Video Seek Sync =====
    function formatVideoTime(seconds) {
      if (!seconds || isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${String(s).padStart(2, '0')}`;
    }

    function resetVideoSlider() {
      const slider = document.getElementById('video-seek-slider');
      const timeCur = document.getElementById('video-time-current');
      const timeDur = document.getElementById('video-time-duration');
      if (slider) slider.value = 0;
      if (timeCur) timeCur.textContent = '0:00';
      if (timeDur) timeDur.textContent = '0:00';
    }

    function updateVideoSliderPosition() {
      if (videoSeeking || !videoDuration) return;
      const slider = document.getElementById('video-seek-slider');
      const timeCur = document.getElementById('video-time-current');
      if (slider) slider.value = (videoCurrentTime / videoDuration) * 1000;
      if (timeCur) timeCur.textContent = formatVideoTime(videoCurrentTime);
    }

    function setupYouTubeListener(iframe) {
      // When iframe loads, send listening message to get infoDelivery events
      iframe.addEventListener('load', function onLoad() {
        iframe.removeEventListener('load', onLoad);
        try {
          iframe.contentWindow.postMessage(JSON.stringify({
            event: 'listening',
            id: 1,
            channel: 'widget'
          }), '*');
        } catch (e) {}
      });
    }

    // Global message listener for YouTube iframe postMessage API
    window.addEventListener('message', (event) => {
      try {
        const data = typeof event.data === 'string' ? JSON.parse(event.data) : event.data;
        if (data.event === 'infoDelivery' && data.info) {
          if (typeof data.info.duration === 'number' && data.info.duration > 0) {
            videoDuration = data.info.duration;
            const timeDur = document.getElementById('video-time-duration');
            if (timeDur) timeDur.textContent = formatVideoTime(videoDuration);
          }
          if (typeof data.info.currentTime === 'number') {
            videoCurrentTime = data.info.currentTime;
            updateVideoSliderPosition();
          }
        }
      } catch (e) {}
    });

    function seekVideoLocal(time) {
      const iframe = document.getElementById('video-iframe');
      if (!iframe || !iframe.contentWindow) return;
      try {
        iframe.contentWindow.postMessage(JSON.stringify({
          event: 'command',
          func: 'seekTo',
          args: [time, true]
        }), '*');
      } catch (e) {}
      videoCurrentTime = time;
    }

    function seekVideoAndSync(time) {
      seekVideoLocal(time);
      // Forward seek to audience window
      window.api.sendPresenterControl({ type: 'video-seek', time });
    }

    function stopVideoTimeTracking() {
      if (videoTimeInterval) {
        clearInterval(videoTimeInterval);
        videoTimeInterval = null;
      }
    }

    function setupVideoSeekSlider() {
      const slider = document.getElementById('video-seek-slider');
      if (!slider) return;

      slider.addEventListener('input', () => {
        videoSeeking = true;
        if (videoDuration) {
          const time = (parseFloat(slider.value) / 1000) * videoDuration;
          const timeCur = document.getElementById('video-time-current');
          if (timeCur) timeCur.textContent = formatVideoTime(time);
        }
      });

      slider.addEventListener('change', () => {
        if (videoDuration) {
          const time = (parseFloat(slider.value) / 1000) * videoDuration;
          seekVideoAndSync(time);
        }
        videoSeeking = false;
      });
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // ===== Navigation =====
    function nextSlide() {
      if (currentSlide < totalSlides) renderSlide(currentSlide + 1);
    }

    function prevSlide() {
      if (currentSlide > 1) renderSlide(currentSlide - 1);
    }

    function setupNavigation() {
      document.getElementById('btn-prev').addEventListener('click', prevSlide);
      document.getElementById('btn-next').addEventListener('click', nextSlide);
      document.getElementById('btn-end').addEventListener('click', () => {
        window.api.stopPresentation();
      });
    }

    // ===== Timer =====
    function setupTimer() {
      document.getElementById('btn-timer-toggle').addEventListener('click', () => {
        if (timerRunning) pauseTimer();
        else startTimer();
      });
      document.getElementById('btn-timer-reset').addEventListener('click', resetTimer);
    }

    function startTimer() {
      timerRunning = true;
      document.getElementById('timer-play-icon').classList.add('hidden');
      document.getElementById('timer-pause-icon').classList.remove('hidden');
      timerInterval = setInterval(() => {
        timerSeconds++;
        updateTimerDisplay();
        window.api.sendTimerSync({ timerSeconds, timerRunning: true });
      }, 1000);
    }

    function pauseTimer() {
      timerRunning = false;
      document.getElementById('timer-play-icon').classList.remove('hidden');
      document.getElementById('timer-pause-icon').classList.add('hidden');
      clearInterval(timerInterval);
      window.api.sendTimerSync({ timerSeconds, timerRunning: false });
    }

    function resetTimer() {
      timerSeconds = 0;
      updateTimerDisplay();
      window.api.sendTimerSync({ timerSeconds: 0, timerRunning });
    }

    function updateTimerDisplay() {
      const h = Math.floor(timerSeconds / 3600);
      const m = Math.floor((timerSeconds % 3600) / 60);
      const s = timerSeconds % 60;
      document.getElementById('timer').textContent =
        `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    // ===== Black Screen =====
    function toggleBlackScreen() {
      blackScreenEnabled = !blackScreenEnabled;
      updateBlackScreenButton();
      // Forward to audience window
      window.api.sendPresenterControl({ type: 'black-screen', enabled: blackScreenEnabled });
      // Update server state so mobile remote stays in sync
      window.api.sendStateUpdate({ blackScreen: blackScreenEnabled });
    }

    function updateBlackScreenButton() {
      const btn = document.getElementById('btn-black-screen');
      if (btn) btn.classList.toggle('active', blackScreenEnabled);
    }

    // ===== Tools =====
    function setupTools() {
      // Tool buttons
      document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.addEventListener('click', () => toggleTool(btn.dataset.tool));
      });

      // Clear drawing
      document.getElementById('tb-clear').addEventListener('click', () => {
        const canvas = document.getElementById('draw-overlay');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        window.api.sendPresenterControl({ type: 'tool-data', data: { tool: 'draw', action: 'clear' } });
      });

      // Colors
      document.querySelectorAll('.tool-color').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.tool-color').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          drawColor = btn.dataset.color;
        });
      });

      // Size slider
      document.getElementById('tool-size-slider').addEventListener('input', (e) => {
        toolSize = parseInt(e.target.value);
        if (activeTool) {
          sendToolSize();
        }
      });
    }

    function setTool(toolName) {
      document.querySelectorAll('.tool-overlay').forEach(el => el.classList.add('hidden'));
      activeTool = toolName || null;

      if (toolName) {
        const overlay = document.getElementById(toolName + '-overlay');
        if (overlay) overlay.classList.remove('hidden');
      }

      document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tool === toolName);
      });

      // Forward to audience
      window.api.sendPresenterControl({ type: 'tool', tool: toolName || null });
    }

    function toggleTool(toolName) {
      setTool(activeTool === toolName ? null : toolName);
    }

    function sendToolSize() {
      const sizeMap = {
        pointer: toolSize,
        flashlight: toolSize,
        draw: toolSize,
        zoom: toolSize * 10
      };
      if (activeTool && sizeMap[activeTool] !== undefined) {
        window.api.sendPresenterControl({
          type: 'tool-size',
          data: { tool: activeTool, size: sizeMap[activeTool] }
        });
      }
    }

    // ===== Mouse Tools =====
    function setupMouseTools() {
      const container = document.getElementById('current-slide-container');
      const wrapper = document.getElementById('current-slide-wrapper');

      function getRelativePos(e) {
        const rect = wrapper.getBoundingClientRect();
        return {
          x: Math.max(0, Math.min(100, ((e.clientX - rect.left) / rect.width) * 100)),
          y: Math.max(0, Math.min(100, ((e.clientY - rect.top) / rect.height) * 100))
        };
      }

      container.addEventListener('mousedown', (e) => {
        if (!activeTool) return;
        const pos = getRelativePos(e);

        if (activeTool === 'draw') {
          isLocalDrawing = true;
          isDrawing = true;
          const canvas = document.getElementById('draw-overlay');
          lastDrawX = pos.x * canvas.width / 100;
          lastDrawY = pos.y * canvas.height / 100;
          window.api.sendPresenterControl({
            type: 'tool-data',
            data: { tool: 'draw', action: 'start', x: pos.x, y: pos.y, color: drawColor, lineWidth: Math.max(1, toolSize / 5) }
          });
        }
      });

      container.addEventListener('mousemove', (e) => {
        if (!activeTool) return;
        const pos = getRelativePos(e);

        switch (activeTool) {
          case 'flashlight':
            handleToolDataLocal({ tool: 'flashlight', x: pos.x, y: pos.y, r: toolSize });
            window.api.sendPresenterControl({ type: 'tool-data', data: { tool: 'flashlight', x: pos.x, y: pos.y, r: toolSize } });
            break;
          case 'pointer':
            handleToolDataLocal({ tool: 'pointer', x: pos.x, y: pos.y, size: toolSize });
            window.api.sendPresenterControl({ type: 'tool-data', data: { tool: 'pointer', x: pos.x, y: pos.y, size: toolSize } });
            break;
          case 'draw':
            if (isLocalDrawing) {
              const canvas = document.getElementById('draw-overlay');
              const ctx = canvas.getContext('2d');
              const newX = pos.x * canvas.width / 100;
              const newY = pos.y * canvas.height / 100;
              ctx.beginPath();
              ctx.moveTo(lastDrawX, lastDrawY);
              ctx.lineTo(newX, newY);
              ctx.strokeStyle = drawColor;
              ctx.lineWidth = Math.max(1, toolSize / 5);
              ctx.lineCap = 'round';
              ctx.lineJoin = 'round';
              ctx.stroke();
              lastDrawX = newX;
              lastDrawY = newY;
              window.api.sendPresenterControl({
                type: 'tool-data',
                data: { tool: 'draw', action: 'move', x: pos.x, y: pos.y, color: drawColor, lineWidth: Math.max(1, toolSize / 5) }
              });
            }
            break;
          case 'zoom':
            handleToolDataLocal({ tool: 'zoom', x: pos.x, y: pos.y });
            window.api.sendPresenterControl({ type: 'tool-data', data: { tool: 'zoom', x: pos.x, y: pos.y } });
            break;
        }
      });

      container.addEventListener('mouseup', () => {
        if (isLocalDrawing) {
          isLocalDrawing = false;
          isDrawing = false;
          window.api.sendPresenterControl({
            type: 'tool-data',
            data: { tool: 'draw', action: 'end' }
          });
        }
      });
    }

    function handleToolDataLocal(data) {
      switch (data.tool) {
        case 'pointer': {
          const dot = document.getElementById('pointer-dot');
          dot.style.left = data.x + '%';
          dot.style.top = data.y + '%';
          dot.style.width = (data.size || toolSize) + 'px';
          dot.style.height = (data.size || toolSize) + 'px';
          break;
        }
        case 'flashlight': {
          const mask = document.getElementById('flashlight-mask');
          mask.style.setProperty('--cx', data.x + '%');
          mask.style.setProperty('--cy', data.y + '%');
          mask.style.setProperty('--r', (data.r || toolSize) + '%');
          break;
        }
        case 'zoom': {
          const lens = document.getElementById('zoom-lens');
          const lensSize = toolSize * 10;
          lens.style.left = data.x + '%';
          lens.style.top = data.y + '%';
          lens.style.width = lensSize + 'px';
          lens.style.height = lensSize + 'px';
          updateZoomCanvas(data.x, data.y);
          break;
        }
      }
    }

    function updateZoomCanvas(xPercent, yPercent) {
      const slideCanvas = document.getElementById('current-slide-canvas');
      const zoomCanvas = document.getElementById('zoom-canvas');
      const lens = document.getElementById('zoom-lens');
      const lensSize = parseInt(lens.style.width) || 200;

      zoomCanvas.width = lensSize;
      zoomCanvas.height = lensSize;

      const ctx = zoomCanvas.getContext('2d');
      const srcX = (xPercent / 100) * slideCanvas.width - (lensSize / ZOOM_FACTOR) / 2;
      const srcY = (yPercent / 100) * slideCanvas.height - (lensSize / ZOOM_FACTOR) / 2;
      const srcSize = lensSize / ZOOM_FACTOR;

      ctx.clearRect(0, 0, lensSize, lensSize);
      ctx.drawImage(slideCanvas, srcX, srcY, srcSize, srcSize, 0, 0, lensSize, lensSize);
    }

    // ===== Keyboard Shortcuts =====
    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && !e.shiftKey) {
          switch (e.key.toLowerCase()) {
            case 'l': e.preventDefault(); toggleTool('flashlight'); return;
            case 'd': e.preventDefault(); toggleTool('draw'); return;
            case 'p': e.preventDefault(); toggleTool('pointer'); return;
            case 'm': e.preventDefault(); toggleTool('zoom'); return;
          }
        }

        if (!e.metaKey && !e.ctrlKey && !e.shiftKey) {
          switch (e.key) {
            case 'ArrowRight':
            case 'ArrowDown':
            case ' ':
            case 'PageDown':
              e.preventDefault();
              nextSlide();
              break;
            case 'ArrowLeft':
            case 'ArrowUp':
            case 'PageUp':
              e.preventDefault();
              prevSlide();
              break;
            case 'b':
            case 'B':
              e.preventDefault();
              toggleBlackScreen();
              break;
            case 'Escape':
              if (activeTool) {
                setTool(null);
              } else {
                window.api.stopPresentation();
              }
              break;
          }
        }
      });
    }

    // ===== Scroll Wheel =====
    function setupScrollWheel() {
      document.getElementById('current-slide-container').addEventListener('wheel', (e) => {
        if (!activeTool) return;
        e.preventDefault();

        const delta = e.deltaY > 0 ? -1 : 1;
        toolSize = Math.max(2, Math.min(50, toolSize + delta));
        document.getElementById('tool-size-slider').value = toolSize;
        sendToolSize();

        // Live update active tool locally
        if (activeTool === 'flashlight') {
          const mask = document.getElementById('flashlight-mask');
          mask.style.setProperty('--r', toolSize + '%');
        }
        if (activeTool === 'pointer') {
          const dot = document.getElementById('pointer-dot');
          dot.style.width = toolSize + 'px';
          dot.style.height = toolSize + 'px';
        }
        if (activeTool === 'zoom') {
          const lens = document.getElementById('zoom-lens');
          lens.style.width = (toolSize * 10) + 'px';
          lens.style.height = (toolSize * 10) + 'px';
        }
      }, { passive: false });
    }

    // ===== Video =====
    function setupVideoPlayButton() {
      document.getElementById('video-play-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        toggleVideoPlayback();
      });
    }

    // ===== Notes Font Size =====
    function setupNoteFontControls() {
      document.getElementById('btn-font-increase').addEventListener('click', () => {
        notesFontSize = Math.min(32, notesFontSize + 1);
        applyNotesFontSize();
      });
      document.getElementById('btn-font-decrease').addEventListener('click', () => {
        notesFontSize = Math.max(10, notesFontSize - 1);
        applyNotesFontSize();
      });
    }

    function applyNotesFontSize() {
      document.getElementById('notes-font-label').textContent = notesFontSize + 'px';
      document.querySelectorAll('.notes-text').forEach(el => {
        el.style.fontSize = notesFontSize + 'px';
      });
    }

    // ===== Horizontal Resize Divider =====
    function setupHorizontalDivider() {
      const divider = document.getElementById('resize-divider-h');
      const nextSlideArea = document.getElementById('next-slide-area');
      let isDragging = false;
      let startY = 0;
      let startHeight = 0;
      let hResizeTimer = null;

      divider.addEventListener('mousedown', (e) => {
        isDragging = true;
        startY = e.clientY;
        startHeight = nextSlideArea.offsetHeight;
        divider.classList.add('dragging');
        document.body.classList.add('resizing-h');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const diff = e.clientY - startY;
        const rightPanel = document.getElementById('right-panel');
        const maxH = rightPanel.clientHeight - 80;
        const newHeight = Math.max(60, Math.min(maxH, startHeight + diff));
        nextSlideArea.style.height = newHeight + 'px';
        nextSlideArea.style.flexShrink = '0';
        // Debounced re-render for real-time update
        clearTimeout(hResizeTimer);
        hResizeTimer = setTimeout(() => {
          if (pdfDoc && currentSlide && currentSlide < totalSlides) {
            renderSlideToCanvas(currentSlide + 1, 'next-slide-canvas', 'next-slide-container');
          }
        }, 100);
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        clearTimeout(hResizeTimer);
        divider.classList.remove('dragging');
        document.body.classList.remove('resizing-h');
        // Re-render next slide to fit new size
        if (pdfDoc && currentSlide && currentSlide < totalSlides) {
          renderSlideToCanvas(currentSlide + 1, 'next-slide-canvas', 'next-slide-container');
        }
      });
    }

    // ===== Thumbnail Carousel =====
    async function renderThumbnailCarousel() {
      const carousel = document.getElementById('thumbnail-carousel');
      carousel.innerHTML = '';
      for (let i = 1; i <= totalSlides; i++) {
        const thumb = document.createElement('div');
        thumb.className = 'thumb-item' + (i === currentSlide ? ' active' : '');
        thumb.dataset.slide = i;

        const canvas = document.createElement('canvas');
        thumb.appendChild(canvas);

        const num = document.createElement('span');
        num.className = 'thumb-num';
        num.textContent = i;
        thumb.appendChild(num);

        thumb.addEventListener('click', () => renderSlide(i));
        carousel.appendChild(thumb);

        // Render thumbnail
        const page = await pdfDoc.getPage(i);
        const defaultVp = page.getViewport({ scale: 1 });
        const thumbDpr = window.devicePixelRatio || 1;
        const thumbScale = 120 / defaultVp.width;
        const vp = page.getViewport({ scale: thumbScale * thumbDpr });
        canvas.width = vp.width;
        canvas.height = vp.height;
        canvas.style.width = (vp.width / thumbDpr) + 'px';
        canvas.style.height = (vp.height / thumbDpr) + 'px';
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      }
    }

    function updateCarouselActive(num) {
      const carousel = document.getElementById('thumbnail-carousel');
      carousel.querySelectorAll('.thumb-item').forEach(el => {
        el.classList.toggle('active', parseInt(el.dataset.slide) === num);
      });
      // Auto-scroll to active thumbnail
      const active = carousel.querySelector('.thumb-item.active');
      if (active) {
        active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
    }

    // ===== Resizable Divider =====
    function setupResizeDivider() {
      const divider = document.getElementById('resize-divider');
      const rightPanel = document.getElementById('right-panel');
      let isDragging = false;
      let startX = 0;
      let startWidth = 0;
      let vResizeTimer = null;

      divider.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX;
        startWidth = rightPanel.offsetWidth;
        divider.classList.add('dragging');
        document.body.classList.add('resizing');
        e.preventDefault();
      });

      document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        const diff = startX - e.clientX;
        const newWidth = Math.max(200, Math.min(window.innerWidth * 0.6, startWidth + diff));
        rightPanel.style.width = newWidth + 'px';
        // Debounced re-render for real-time update
        clearTimeout(vResizeTimer);
        vResizeTimer = setTimeout(() => {
          if (pdfDoc && currentSlide) {
            renderSlide(currentSlide);
          }
        }, 100);
      });

      document.addEventListener('mouseup', () => {
        if (!isDragging) return;
        isDragging = false;
        clearTimeout(vResizeTimer);
        divider.classList.remove('dragging');
        document.body.classList.remove('resizing');
        // Re-render slides to fit new layout
        if (pdfDoc && currentSlide) {
          renderSlide(currentSlide);
        }
      });
    }

    // ===== QR Button =====
    function setupQRButton() {
      document.getElementById('btn-qr').addEventListener('click', showQR);
      document.getElementById('qr-close-btn').addEventListener('click', () => {
        document.getElementById('qr-overlay').classList.add('hidden');
      });
      document.getElementById('qr-overlay').addEventListener('click', (e) => {
        if (e.target === e.currentTarget) {
          document.getElementById('qr-overlay').classList.add('hidden');
        }
      });
    }

    async function showQR() {
      const overlay = document.getElementById('qr-overlay');
      overlay.classList.remove('hidden');
      try {
        const info = await window.api.getServerInfo();
        if (!info) return;
        const resp = await fetch(`http://localhost:${info.port}/api/qr`);
        const data = await resp.json();
        document.getElementById('qr-content').innerHTML = `<img src="${data.qr}" alt="QR Code" style="width:250px;height:250px">`;
        document.getElementById('qr-url-text').textContent = data.url;
      } catch (err) {
        document.getElementById('qr-content').innerHTML = '<p style="color:#f85149">Error al cargar QR</p>';
      }
    }

    // ===== Cast / AirPlay Button =====
    function setupCastButton() {
      document.getElementById('btn-cast').addEventListener('click', () => {
        window.api.showCastPicker();
      });
    }

    // ===== Black Screen Button =====
    function setupBlackScreenButton() {
      document.getElementById('btn-black-screen').addEventListener('click', toggleBlackScreen);
    }

    // ===== System Clock =====
    function setupSystemClock() {
      function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('system-clock').textContent = h + ':' + m;
      }
      updateClock();
      setInterval(updateClock, 10000);
    }

    // ===== Remote Control Handling =====
    function handleRemoteControl(action) {
      if (typeof action === 'object') {
        switch (action.type) {
          case 'navigate': if (action.slide !== currentSlide) renderSlide(action.slide); break;
          case 'next': nextSlide(); break;
          case 'prev': prevSlide(); break;
          case 'tool': setTool(action.tool); break;
          case 'tool-data': handleToolDataFromRemote(action.data); break;
          case 'tool-size': handleToolSizeFromRemote(action.data); break;
          case 'video-toggle': toggleVideoPlaybackLocal(); break;
          case 'video-seek': if (typeof action.time === 'number') seekVideoLocal(action.time); break;
          case 'black-screen':
            blackScreenEnabled = !!action.enabled;
            updateBlackScreenButton();
            break;
          case 'timer-toggle':
            if (action.data) {
              timerRunning = action.data.timerRunning;
              timerSeconds = action.data.timerSeconds;
              if (timerRunning) {
                clearInterval(timerInterval);
                timerInterval = setInterval(() => {
                  timerSeconds++;
                  updateTimerDisplay();
                  window.api.sendTimerSync({ timerSeconds, timerRunning: true });
                }, 1000);
                document.getElementById('timer-play-icon').classList.add('hidden');
                document.getElementById('timer-pause-icon').classList.remove('hidden');
              } else {
                clearInterval(timerInterval);
                document.getElementById('timer-play-icon').classList.remove('hidden');
                document.getElementById('timer-pause-icon').classList.add('hidden');
              }
              updateTimerDisplay();
            }
            break;
          case 'timer-reset':
            if (action.data) {
              timerSeconds = 0;
              updateTimerDisplay();
              window.api.sendTimerSync({ timerSeconds: 0, timerRunning });
            }
            break;
        }
      }
    }

    function handleToolDataFromRemote(data) {
      if (!data) return;
      switch (data.tool) {
        case 'pointer':
        case 'flashlight':
        case 'zoom':
          handleToolDataLocal(data);
          break;
        case 'draw': {
          const drawOverlay = document.getElementById('draw-overlay');
          if (drawOverlay.classList.contains('hidden')) {
            drawOverlay.classList.remove('hidden');
          }
          drawFromRemote(data);
          break;
        }
      }
    }

    let remoteDrawing = false;
    let remoteLastX = 0;
    let remoteLastY = 0;

    function drawFromRemote(data) {
      const canvas = document.getElementById('draw-overlay');
      const ctx = canvas.getContext('2d');
      if (data.action === 'start') {
        remoteDrawing = true;
        remoteLastX = data.x * canvas.width / 100;
        remoteLastY = data.y * canvas.height / 100;
      } else if (data.action === 'move' && remoteDrawing) {
        const newX = data.x * canvas.width / 100;
        const newY = data.y * canvas.height / 100;
        ctx.beginPath();
        ctx.moveTo(remoteLastX, remoteLastY);
        ctx.lineTo(newX, newY);
        ctx.strokeStyle = data.color || drawColor;
        ctx.lineWidth = data.lineWidth || Math.max(1, toolSize / 5);
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        ctx.stroke();
        remoteLastX = newX;
        remoteLastY = newY;
      } else if (data.action === 'end') {
        remoteDrawing = false;
      } else if (data.action === 'clear') {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
    }

    function handleToolSizeFromRemote(data) {
      if (!data) return;
      switch (data.tool) {
        case 'pointer': {
          const dot = document.getElementById('pointer-dot');
          dot.style.width = data.size + 'px';
          dot.style.height = data.size + 'px';
          if (activeTool === 'pointer') toolSize = data.size;
          break;
        }
        case 'flashlight': {
          const mask = document.getElementById('flashlight-mask');
          mask.style.setProperty('--r', data.size + '%');
          if (activeTool === 'flashlight') toolSize = data.size;
          break;
        }
        case 'draw': {
          if (activeTool === 'draw') toolSize = data.size;
          break;
        }
        case 'zoom': {
          const lens = document.getElementById('zoom-lens');
          lens.style.width = data.size + 'px';
          lens.style.height = data.size + 'px';
          if (activeTool === 'zoom') toolSize = Math.round(data.size / 10);
          break;
        }
      }
    }

    // Handle resize
    window.addEventListener('resize', () => {
      if (pdfDoc && currentSlide) {
        renderSlide(currentSlide);
      }
    });

    // Re-render when window regains visibility (e.g. switching from audience screen)
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && pdfDoc && currentSlide) {
        renderSlide(currentSlide);
      }
    });
    window.addEventListener('focus', () => {
      if (pdfDoc && currentSlide) {
        renderSlide(currentSlide);
      }
    });
  </script>
