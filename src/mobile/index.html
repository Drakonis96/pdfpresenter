<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>PDF Presenter Remote</title>
  <link rel="icon" type="image/png" href="/mobile/logo.png">
  <link rel="apple-touch-icon" href="/mobile/logo.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Connection screen -->
  <div class="screen" id="screen-connect">
    <div class="connect-container">
      <div class="logo">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#2f81f7" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
          <polyline points="14 2 14 8 20 8"/>
        </svg>
        <h1>PDF Presenter</h1>
      </div>
      <p class="text-muted">Conectando al servidor...</p>
      <div class="spinner"></div>
    </div>
  </div>

  <!-- Waiting screen (connected but no presentation active) -->
  <div class="screen hidden" id="screen-waiting">
    <div class="connect-container">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#3fb950" stroke-width="2">
        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
        <polyline points="22 4 12 14.01 9 11.01"/>
      </svg>
      <h2>Conectado</h2>
      <p class="text-muted">Esperando a que se inicie una presentación...</p>
    </div>
  </div>

  <!-- Presenter remote screen -->
  <div class="screen hidden" id="screen-remote">
    <!-- Top bar -->
    <div class="top-bar">
      <div class="top-bar-left">
        <span class="mobile-timer" id="mobile-timer">00:00:00</span>
        <button class="btn-icon btn-timer-reset" id="btn-timer-reset" title="Reiniciar timer">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="1 4 1 10 7 10"/>
            <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
          </svg>
        </button>
      </div>
      <div class="top-bar-right">
        <span class="slide-counter" id="slide-counter">1 / 1</span>
        <button class="btn-icon" id="btn-fullscreen-mode" title="Pantalla completa">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-carousel" title="Diapositivas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
            <line x1="8" y1="21" x2="16" y2="21"/>
            <line x1="12" y1="17" x2="12" y2="21"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-local-preview" title="Vista local de notas">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M7 3h8l4 4v14H7z"/>
            <path d="M15 3v4h4"/>
            <line x1="10" y1="12" x2="16" y2="12"/>
            <line x1="10" y1="16" x2="14" y2="16"/>
          </svg>
        </button>
        <button class="btn-icon" id="btn-settings" title="Ajustes">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Slide preview area -->
    <div class="slide-area">
      <div class="slide-preview" id="slide-preview">
        <canvas id="preview-canvas"></canvas>
        <!-- Tool overlays on preview -->
        <div class="preview-tool-overlay hidden" id="preview-pointer-overlay">
          <div class="preview-pointer-dot" id="preview-pointer-dot"></div>
        </div>
        <div class="preview-tool-overlay hidden" id="preview-flashlight-overlay">
          <div class="preview-flashlight-mask" id="preview-flashlight-mask"></div>
        </div>
        <canvas class="preview-tool-overlay hidden" id="preview-draw-overlay"></canvas>
        <div class="preview-tool-overlay hidden" id="preview-zoom-overlay">
          <div class="preview-zoom-dot" id="preview-zoom-dot"></div>
        </div>
        <!-- Clear drawing button (shown when draw mode active) -->
        <button class="btn-clear-draw hidden" id="btn-clear-draw" title="Limpiar dibujo">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
        <!-- Touch area for pointer/draw/flashlight/zoom -->
        <div class="touch-area" id="touch-area"></div>
      </div>
    </div>

    <!-- Tools bar -->
    <div class="tools-bar">
      <button class="tool-btn" id="tool-flashlight" data-tool="flashlight" title="Linterna">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3h6l1 4H8z"/>
          <path d="M10 7h4l1 6H9z"/>
          <path d="M11 13h2v8h-2z"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-draw" data-tool="draw" title="Dibujo">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-pointer" data-tool="pointer" title="Puntero">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
      </button>
      <button class="tool-btn" id="tool-zoom" data-tool="zoom" title="Lupa">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button class="tool-btn" id="btn-pinch-zoom" title="Pellizco para ampliar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="tool-btn video-toggle-btn hidden" id="btn-video-toggle" title="Video">
        <svg id="mobile-video-play-icon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="mobile-video-pause-icon" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <button class="tool-btn" id="btn-black-screen" title="Pantalla en negro">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="12" rx="2" ry="2"/>
          <line x1="5" y1="7" x2="19" y2="15"/>
        </svg>
      </button>
      <button class="btn-icon tool-extra" id="btn-tool-settings" title="Ajustar tamaño">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="4" y1="21" x2="4" y2="14"/>
          <line x1="4" y1="10" x2="4" y2="3"/>
          <line x1="12" y1="21" x2="12" y2="12"/>
          <line x1="12" y1="8" x2="12" y2="3"/>
          <line x1="20" y1="21" x2="20" y2="16"/>
          <line x1="20" y1="12" x2="20" y2="3"/>
          <line x1="1" y1="14" x2="7" y2="14"/>
          <line x1="9" y1="8" x2="15" y2="8"/>
          <line x1="17" y1="16" x2="23" y2="16"/>
        </svg>
      </button>
    </div>

    <!-- Resizable divider -->
    <div class="resize-handle" id="resize-handle">
      <div class="resize-handle-bar"></div>
    </div>

    <!-- Notes section -->
    <div class="notes-section" id="notes-section">
      <div class="notes-header">
        <span class="notes-label">Notas</span>
        <span class="notes-slide-label" id="notes-slide-label">Slide 1</span>
        <div class="notes-font-controls">
          <button class="btn-small" id="btn-font-decrease">−</button>
          <span class="font-size-value" id="font-size-value">16</span>
          <button class="btn-small" id="btn-font-increase">+</button>
        </div>
      </div>
      <div class="notes-content" id="notes-content">
        <p class="notes-empty">Sin notas para esta diapositiva</p>
      </div>
    </div>

    <!-- Slide dots -->
    <div class="slide-dots" id="slide-dots"></div>

    <!-- Navigation buttons -->
    <div class="nav-buttons">
      <button class="nav-btn nav-prev" id="btn-prev">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="nav-btn nav-next" id="btn-next">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
    </div>

    <!-- Fullscreen bottom bar (shown in fullscreen/landscape mode) -->
    <div class="fullscreen-bar" id="fullscreen-bar">
      <button class="nav-btn nav-prev" id="fs-btn-prev">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <button class="nav-btn nav-next" id="fs-btn-next">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
      </button>
      <span class="slide-counter-fs" id="fs-slide-counter">1 / 1</span>
      <button class="tool-btn" id="fs-tool-flashlight" data-tool="flashlight" title="Linterna">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3h6l1 4H8z"/>
          <path d="M10 7h4l1 6H9z"/>
          <path d="M11 13h2v8h-2z"/>
        </svg>
      </button>
      <button class="tool-btn" id="fs-tool-draw" data-tool="draw" title="Dibujo">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 19l7-7 3 3-7 7-3-3z"/>
          <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
          <path d="M2 2l7.586 7.586"/>
          <circle cx="11" cy="11" r="2"/>
        </svg>
      </button>
      <button class="tool-btn" id="fs-tool-pointer" data-tool="pointer" title="Puntero">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <circle cx="12" cy="12" r="3" fill="currentColor"/>
        </svg>
      </button>
      <button class="tool-btn" id="fs-tool-zoom" data-tool="zoom" title="Lupa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button class="tool-btn" id="fs-btn-pinch-zoom" title="Pellizco para ampliar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l4 4M18 6l-4 4M6 18l4-4M18 18l-4-4"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
      <button class="tool-btn video-toggle-btn hidden" id="fs-btn-video-toggle" title="Video">
        <svg id="fs-video-play-icon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <polygon points="5 3 19 12 5 21 5 3"/>
        </svg>
        <svg id="fs-video-pause-icon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="none">
          <rect x="6" y="4" width="4" height="16"/>
          <rect x="14" y="4" width="4" height="16"/>
        </svg>
      </button>
      <button class="tool-btn" id="fs-btn-black-screen" title="Pantalla en negro">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="12" rx="2" ry="2"/>
          <line x1="5" y1="7" x2="19" y2="15"/>
        </svg>
      </button>
      <button class="btn-icon btn-exit-fullscreen" id="btn-exit-fullscreen" title="Salir de pantalla completa">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 14h6v6M20 10h-6V4M14 10l7-7M3 21l7-7"/>
        </svg>
      </button>
    </div>


  </div>

  <!-- Slide carousel overlay -->
  <div class="carousel-overlay hidden" id="carousel-overlay">
    <div class="carousel-backdrop" id="carousel-backdrop"></div>
    <div class="carousel-container">
      <div class="carousel-header">
        <span class="carousel-title">Diapositivas</span>
        <button class="btn-icon carousel-close" id="carousel-close">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="carousel-track" id="carousel-track"></div>
    </div>
  </div>

  <!-- Tool size popup -->
  <div class="tool-size-popup hidden" id="tool-size-popup">
    <div class="tool-size-panel">
      <h3>Tamaño de herramientas</h3>
      <div class="tool-size-row">
        <label>Puntero</label>
        <input type="range" id="size-pointer" min="5" max="50" value="20">
        <span class="size-value" id="size-pointer-val">20</span>
      </div>
      <div class="tool-size-row">
        <label>Linterna</label>
        <input type="range" id="size-flashlight" min="5" max="40" value="15">
        <span class="size-value" id="size-flashlight-val">15</span>
      </div>
      <div class="tool-size-row">
        <label>Dibujo</label>
        <input type="range" id="size-draw" min="1" max="20" value="4">
        <span class="size-value" id="size-draw-val">4</span>
      </div>
      <div class="tool-size-row">
        <label>Diámetro lupa</label>
        <input type="range" id="size-zoom" min="100" max="400" value="200">
        <span class="size-value" id="size-zoom-val">200</span>
      </div>
      <div class="tool-size-row">
        <label>Aumento</label>
        <div class="zoom-factor-buttons" id="zoom-factor-buttons">
          <button class="zoom-factor-btn" data-factor="1.5">1.5×</button>
          <button class="zoom-factor-btn active" data-factor="2">2×</button>
          <button class="zoom-factor-btn" data-factor="2.5">2.5×</button>
          <button class="zoom-factor-btn" data-factor="3">3×</button>
        </div>
      </div>
      <h3 class="section-title">Volumen del sistema</h3>
      <div class="tool-size-row volume-row">
        <button class="btn-icon btn-volume-mute" id="btn-volume-mute" title="Silenciar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
            <path id="volume-icon-waves" d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
          </svg>
        </button>
        <input type="range" id="volume-slider" min="0" max="100" value="50">
        <span class="size-value" id="volume-val">50</span>
      </div>
    </div>
  </div>

  <!-- Reconnection toast -->
  <div class="reconnect-toast hidden" id="reconnect-toast">
    <div class="reconnect-spinner"></div>
    <span>Reconectando...</span>
  </div>

  <script src="app.js"></script>
</body>
</html>
